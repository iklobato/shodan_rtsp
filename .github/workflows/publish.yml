name: publish

# A published image is a release, so it goes out on a version tag and never on a
# push to a branch. The tag has to be the version in pyproject.toml, so the
# image name and the git tag cannot drift apart.
on:
  push:
    tags: ["v*"]

permissions:
  contents: read

env:
  IMAGE: ${{ secrets.DOCKERHUB_USERNAME }}/shodan-rtsp

jobs:
  publish:
    name: build, test and push
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7

      # The suite runs here too, not only in ci.yml: a tag whose tests fail must
      # not reach the registry.
      - uses: astral-sh/setup-uv@v10
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run pytest -q

      # The version line of [project], not `uv version --short`, whose output
      # carries colour codes when uv thinks it has a terminal.
      - name: The tag has to be the version in pyproject.toml
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' pyproject.toml)"
          if [ "$tag" != "$version" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} does not match" \
              "the pyproject version ${version}"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} is pyproject version ${version}"

      - uses: docker/setup-buildx-action@v4

      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      # Built once and loaded into the local daemon, so the smoke test runs
      # against the exact bytes that are about to be pushed.
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test the image that is about to be published
        run: |
          image="$(printf '%s\n' "${{ steps.meta.outputs.tags }}" | head -1)"
          echo "testing ${image}"
          docker run --rm "${image}" --help
          docker run --rm --entrypoint /opt/venv/bin/python "${image}" -c \
            "import cv2, nmap, onnxruntime, psycopg2; print('imports ok')"
          docker run --rm --entrypoint nmap "${image}" --version

      - name: Push every tag of the release
        run: docker push --all-tags "${IMAGE}"
