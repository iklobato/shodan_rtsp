# Camera brands, as data. Adding a brand is a line here, never a release.
#
# `match` is a list of regular expressions tried in order against the evidence
# text a scan collected (the Shodan banner, or the nmap service product string).
# The first brand whose patterns hit wins, so keep a specific pattern above a
# loose one.
#
# `vendor` and `product` are what the camera is stored as, and the pair is what
# selects the CVEs in the vuln mode (`cpe:2.3:<part>:<vendor>:<product>:...`).
# Correct a wrong pair here rather than in code.
#
# No camera brand has a product NVD knows: a camera CVE names the model, and its
# vulnerable range sits on the model's firmware CPE (`<model>_firmware`, part
# `o`), while the hardware CPE of the same model is flagged not vulnerable.
# The probe retries a pair as `<product>_firmware` for that reason. So a brand
# entry names the brand and is what the check mode uses, and a model entry names
# one model and is what reaches a CVE. Check a pair before adding it, or the
# CVEs you find belong to a different product:
#
#   curl -sG 'https://services.nvd.nist.gov/rest/json/cpes/2.0' \
#     --data-urlencode 'cpeMatchString=cpe:2.3:o:<vendor>:<model>_firmware' \
#     --data-urlencode 'resultsPerPage=1'
#
# Measured 2026-11-11: `hikvision:ip_camera` returns totalResults 0, so the
# brand-level camera pairs below match no CVE at all and are kept for the
# credential set only.
#
# `users`, `passwords` and `url_templates` are the brand credential set the
# check mode tries before the generic wordlists (D22). A brand with none of the
# three still gets identified; only the generic wordlists run for it.

brands:
  # The model a device reports, and the entry that reaches CVE-2017-7921. The
  # credential set is repeated from the brand entry below because the entry that
  # matched is the one the check mode reads the set from.
  hikvision_ds_2cd2032:
    match: ["DS-2CD2032"]
    vendor: hikvision
    product: ds-2cd2032-i
    users: [admin]
    passwords:
      - admin
      - "12345"
      - "123456"
      - "12345678"
      - Password123
      - Hik12345
      - abc123
      - 1q2w3e4r
    url_templates:
      - "rtsp://{0}:{1}@{2}:{3}/h264/ch1/main/av_stream"
      - "rtsp://{0}:{1}@{2}:{3}/Streaming/Channels/101"

  # The models whose firmware CPE the unauthenticated snapshot classes cover
  # (scanners/cve/snapshot_read.py). Each pair is the product NVD hangs the
  # named CVEs on, so the probe reaches them through the `_firmware` retry.
  apexis_apm_h803_mpc:
    match: ["APM-H803"]
    vendor: apexis
    product: apm-h803-mpc

  nightowl_wdb_20:
    match: ["WDB-20"]
    vendor: nightowlsp
    product: wdb-20

  abus_tvip_10000:
    match: ["TVIP 10000", "TVIP-10000"]
    vendor: abus
    product: tvip_10000

  flir_ax8:
    match: ["FLIR AX8", "AX8"]
    vendor: flir
    product: flir_ax8

  apexis:
    match: ["Apexis"]
    vendor: apexis
    product: ip_camera

  nightowl:
    match: ["NightOwl"]
    vendor: nightowlsp
    product: ip_camera

  abus:
    match: ["ABUS"]
    vendor: abus
    product: ip_camera

  flir:
    match: ["FLIR"]
    vendor: flir
    product: ip_camera

  # Above the tplink brand entry on purpose: NVD spells this vendor with a
  # hyphen, and the brand entry cannot reach the model CVEs.
  tplink_tl_sc3130:
    match: ["TL-SC3130"]
    vendor: tp-link
    product: tl-sc3130

  hikvision:
    match: ["Hikvision-IP", "Hikvision", "IpCamera$"]
    vendor: hikvision
    product: ip_camera
    users: [admin]
    passwords:
      - admin
      - "12345"
      - "123456"
      - "12345678"
      - Password123
      - Hik12345
      - abc123
      - 1q2w3e4r
    url_templates:
