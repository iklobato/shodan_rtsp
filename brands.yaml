      - "rtsp://{0}:{1}@{2}:{3}/mjpg/mjpg.cgi"

  samsung:
    match: ["SAMSUNG", "Samsung"]
    vendor: samsung
    product: ip_camera
    users: [admin]
    passwords: [admin, "4321", "1234", "111111", "888888", "666666"]
